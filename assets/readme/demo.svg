<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="743" viewBox="0 0 1200 743" role="img"><title>Actual demo excerpts: answered, fallback, and handoff</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#0b786f"/></marker></defs><rect x="0" y="0" width="1200" height="743" rx="22" fill="#102733" stroke="none"/><text x="46" y="56" fill="#fff" font-size="32" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">A clear answer. A clear boundary.</text><text x="46" y="88" fill="#9bb7c0" font-size="18" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Q&amp;A development demo · actual output, reformatted</text><rect x="34" y="118" width="1132" height="179" rx="14" fill="#183745" stroke="#2a4d5b"/><rect x="53" y="136" width="128" height="29" rx="14" fill="#0b786f" stroke="none"/><text x="117" y="156" fill="#fff" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">ANSWERED</text><text x="198" y="157" fill="#eef6f6" font-size="20" font-weight="600" text-anchor="start" font-family="Arial, Helvetica, sans-serif">What collections does the National Museum of Art of Romania feature?</text><text x="57" y="204" fill="#d9eae9" font-size="21" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">medieval and modern Romanian art</text><text x="57" y="269" fill="#8fb5be" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">source: national_museum_of_art_of_romania</text><rect x="34" y="315" width="1132" height="179" rx="14" fill="#183745" stroke="#2a4d5b"/><rect x="53" y="333" width="128" height="29" rx="14" fill="#aa7430" stroke="none"/><text x="117" y="353" fill="#fff" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">FALLBACK</text><text x="198" y="354" fill="#eef6f6" font-size="20" font-weight="600" text-anchor="start" font-family="Arial, Helvetica, sans-serif">How much is a metro ticket in Bucharest?</text><text x="57" y="401" fill="#d9eae9" font-size="21" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">I can&#x27;t confirm current ticket prices from the knowledge base.</text><text x="57" y="466" fill="#8fb5be" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">reason: UNSUPPORTED_PRICE_QUERY · official source links returned</text><rect x="34" y="512" width="1132" height="179" rx="14" fill="#183745" stroke="#2a4d5b"/><rect x="53" y="530" width="128" height="29" rx="14" fill="#456aaa" stroke="none"/><text x="117" y="550" fill="#fff" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">HANDOFF</text><text x="198" y="551" fill="#eef6f6" font-size="20" font-weight="600" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Set a reminder for tomorrow and tell me where University Square is.</text><text x="57" y="598" fill="#d9eae9" font-size="21" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">This mixes a command with a factual question, so the dialogue manager should split or reroute it.</text><text x="57" y="663" fill="#8fb5be" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">reason: MIXED_COMMAND_QUERY</text><text x="46" y="722" fill="#9bb7c0" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Recorded on the Q&amp;A development branch with the expanded local KB, separately from the Gradio UI.</text></svg>