<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img"><title>Integrated Gradio assistant with trained NLU, Dialogue Manager, and evidence-grounded Q&amp;A</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#0b786f"/></marker></defs><rect x="0" y="0" width="1200" height="830" rx="22" fill="#f5f8f7" stroke="none"/><text x="46" y="57" fill="#162b38" font-size="32" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Three modules. One conversational interface.</text><text x="46" y="90" fill="#506773" font-size="18" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Integrated Gradio app · trained NLU + dialogue generation + local Q&amp;A</text><rect x="46" y="122" width="218" height="80" rx="16" fill="#fff" stroke="#d8e3e2"/><text x="155.0" y="156" fill="#162b38" font-size="22" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Text or speech</text><text x="155.0" y="182" fill="#506773" font-size="16" font-weight="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Gradio + Whisper</text><rect x="326" y="122" width="252" height="80" rx="16" fill="#e0efeb" stroke="#d8e3e2"/><text x="452.0" y="156" fill="#162b38" font-size="22" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Trained NLU</text><text x="452.0" y="182" fill="#506773" font-size="16" font-weight="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Intent + BIO slots</text><rect x="642" y="122" width="512" height="80" rx="16" fill="#fff" stroke="#d8e3e2"/><text x="898.0" y="156" fill="#162b38" font-size="22" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Intent router</text><text x="898.0" y="182" fill="#506773" font-size="16" font-weight="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">DM intents first; factual intents / question heuristic</text><path d="M265 162 L318 162" stroke="#0b786f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M580 162 L634 162" stroke="#0b786f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M898 203 L898 235" stroke="#0b786f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="642" y="245" width="512" height="96" rx="16" fill="#fff" stroke="#d8e3e2"/><text x="668" y="278" fill="#162b38" font-size="22" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Dialogue Manager or fallback</text><text x="668" y="310" fill="#506773" font-size="17" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Recent context + intent + slots → generated response</text><path d="M714 202 L714 220 L189 220 L189 359" fill="none" stroke="#0b786f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="236" y="247" fill="#0b786f" font-size="18" font-weight="600" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Factual question → Q&amp;A</text><rect x="46" y="369" width="1108" height="296" rx="18" fill="#fff" stroke="#d8e3e2"/><text x="73" y="407" fill="#0b786f" font-size="17" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">KNOWLEDGE / Q&amp;A</text><text x="73" y="434" fill="#506773" font-size="18" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Local Bucharest evidence: profiles, structured records, and narrative passages.</text><rect x="74" y="461" width="224" height="128" rx="12" fill="#f2f7f5" stroke="#d8e3e2"/><text x="92" y="494" fill="#162b38" font-size="20" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Profiles + rules</text><text x="92" y="532" fill="#506773" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Overviews, exact facts,</text><text x="92" y="557" fill="#506773" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">travel guidance, transport</text><rect x="350" y="461" width="224" height="128" rx="12" fill="#f2f7f5" stroke="#d8e3e2"/><text x="368" y="494" fill="#162b38" font-size="20" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">BM25 retrieval</text><text x="368" y="532" fill="#506773" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Rank overlapping passages</text><text x="368" y="557" fill="#506773" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">from the local KB</text><rect x="626" y="461" width="224" height="128" rx="12" fill="#f2f7f5" stroke="#d8e3e2"/><text x="644" y="494" fill="#162b38" font-size="20" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Extractive reader</text><text x="644" y="532" fill="#506773" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Select answer spans with</text><text x="644" y="557" fill="#506773" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">a pretrained MiniLM model</text><rect x="902" y="461" width="224" height="128" rx="12" fill="#f2f7f5" stroke="#d8e3e2"/><text x="920" y="494" fill="#162b38" font-size="20" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Confidence checks</text><text x="920" y="532" fill="#506773" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Rank answer candidates;</text><text x="920" y="557" fill="#506773" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">fallback if unsupported</text><path d="M300 525 L343 525" stroke="#0b786f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M576 525 L619 525" stroke="#0b786f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M852 525 L895 525" stroke="#0b786f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="349" y="619" fill="#506773" font-size="17" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Retrieve and read only when profiles or structured rules do not answer.</text><path d="M600 666 L600 690" stroke="#0b786f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="182" y="702" width="836" height="84" rx="14" fill="#163e47" stroke="none"/><text x="600" y="735" fill="#fff" font-size="25" font-weight="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Gradio response + “Last turn” metadata</text><text x="600" y="762" fill="#c2dcda" font-size="18" font-weight="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Intent · slots · selected route · Q&amp;A confidence and source</text><text x="600" y="815" fill="#506773" font-size="16" font-weight="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Q&amp;A API statuses: answered / fallback / handoff. The app presents fallback and handoff generically.</text></svg>